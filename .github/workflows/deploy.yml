# Mise en ligne de Balkanos sur GitHub Pages.
#
# Se lance tout seul à chaque envoi sur la branche « main », ou à la main
# (onglet « Actions » → « Déployer sur GitHub Pages » → « Run workflow »).
#
# Aucun secret n'est nécessaire : les deux réglages Supabase du fichier
# .env.production sont publics par nature (voir les explications dans ce fichier).

name: Déployer sur GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Le strict minimum de droits pour publier la page.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deployer:
    needs: construire
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v4
